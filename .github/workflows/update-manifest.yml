# Aktualisiert manifest.json aus den Repository-Dateien aller Plugins (siehe sources.json).
# Läuft stündlich, bei Änderungen an sources.json und auf Knopfdruck
# (Actions → Manifest aktualisieren → Run workflow).
name: Manifest aktualisieren

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['sources.json', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifeste zusammenführen
        run: python3 scripts/merge_manifests.py

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json >/dev/null 2>&1; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest aktualisiert"
          git push
